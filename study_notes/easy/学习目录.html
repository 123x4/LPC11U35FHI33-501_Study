const KEY='hub_read_v1';let read={};try{read=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(read))}catch(e){}};
function draw(){const q=$('q').value.trim().toLowerCase(),hide=$('hideRead').checked;let shown=0,total=0,done=0;const seen=new Set();
 $('groups').innerHTML=G.map(g=>{const cs=g.items.filter(it=>{const id=it[3];if(!seen.has(id)){seen.add(id);total++;if(read[id])done++}
   if(hide&&read[id])return false;return !q||(it.join(' ')+g.t).toLowerCase().includes(q)});shown+=cs.length;if(!cs.length)return'';
  return `<section class="grp"><h2>${g.t}<small>${g.d}</small></h2><div class="cards">${cs.map(it=>`<div class="cd${read[it[3]]?' read':''}" style="--c:${V(g.c)}"><span class="no">${it[0]}</span><a class="ti" href="${it[3]}" target="_blank" rel="noopener">${it[1]}</a><p>${it[2]}</p><div class="ft"><span class="tag">${it[4]}</span><label><input type="checkbox" data-id="${it[3]}" ${read[it[3]]?'checked':''}> 已读</label></div></div>`).join('')}</div></section>`}).join('')||'<p class="note">没有匹配的页面。</p>';
 $('groups').querySelectorAll('input[data-id]').forEach(c=>c.onchange=()=>{read[c.dataset.id]=c.checked;save();draw()});
 $('cnt').textContent=`显示 ${shown} 项 · 已读 ${done} / ${total}`;$('bar').style.width=(total?done/total*100:0)+'%';
 const nx=G.slice(0,3).flatMap(g=>g.items).find(it=>!read[it[3]]&&it[4]!=='旧'&&it[4]!=='速查');
 $('next').innerHTML=nx?`<b>下一篇建议读：</b><a href="${nx[3]}" target="_blank" rel="noopener">${nx[0]} · ${nx[1]}</a>（${nx[2]}）<br><span class="note">还没写的：第 14 课“一次点击”（先看手册猜代码），以及其余文件的精读。</span>`:'<b>列表里的都读完了。</b>下一步：第 14 课“一次点击”，或挑一个文件让我精读。'}
$('q').oninput=draw;$('hideRead').onchange=draw;draw();
